name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Extra startup time for pip-installed Anki in CI
  ANKI_CONNECT_TIMEOUT: '60000'

jobs:
  test:
    name: Test (${{ matrix.os }}, AnkiConnect ${{ matrix.anki-connect-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        anki-connect-version: ['25.11.9.0', '26.10.14.0']
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Each AnkiConnect fixture is paired with the Anki release it was built for.
        # PyPI omits leading zeros: aqt==25.9.2 is Anki 25.09.2, aqt==26.9.3 is Anki 26.09.3.
        include:
          - anki-connect-version: '25.11.9.0'
            anki-version: '25.9.2'
          - anki-connect-version: '26.10.14.0'
            anki-version: '26.9.3'

    env:
      ANKI_CONNECT_VERSION: ${{ matrix.anki-connect-version }}
      ANKI_VERSION: ${{ matrix.anki-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libegl1 \
            libgl1 \
            libopengl0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxtst6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libgbm1 \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install Anki
        shell: bash
        run: pip install "aqt==${ANKI_VERSION}"

      - name: Verify Anki is importable
        run: python -c "from aqt import run; print('aqt OK')"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Build
        run: pnpm run build

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: pnpm test

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: pnpm test
